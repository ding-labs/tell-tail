[package]
name = "tell-tail"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Bounded-memory log throughput and severity monitor"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
memchr = "2.7"
tempfile = "3"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.29", features = ["use-dev-tty"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["event", "fs"] }
signal-hook = "0.3"
