[package]
name = "tell-tail"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Bounded-memory log throughput and severity monitor"
license = "MIT"
repository = "https://github.com/zuchka/tell-tail"
readme = "README.md"
include = ["src/**", "tests/**", "/Cargo.toml", "/Cargo.lock", "/LICENSE", "/README.md", "/CHANGELOG.md", "docs/**", "packaging/**", "examples/*.service", "scripts/*.py", "scripts/*.txt", "/rust-toolchain.toml"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
memchr = "2.7"
tempfile = "3"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.29", features = ["use-dev-tty"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["event", "fs", "net"] }
signal-hook = "0.3"

[dev-dependencies]
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }
