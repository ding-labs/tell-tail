[package]
name = "tell-tail"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Bounded-memory log throughput and severity monitor"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
memchr = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
