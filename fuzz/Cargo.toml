[package]
name = "tell-tail-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
tell-tail = { path = "..", default-features = false }
serde_json = "1"
serde = "1"
clap = { version = "4.5", features = ["derive"] }

[workspace]
members = ["."]

[[bin]]
name = "framing"
path = "fuzz_targets/framing.rs"
test = false
doc = false
bench = false

[[bin]]
name = "classification"
path = "fuzz_targets/classification.rs"
test = false
doc = false
bench = false

[[bin]]
name = "timed_engine"
path = "fuzz_targets/timed_engine.rs"
test = false
doc = false
bench = false
