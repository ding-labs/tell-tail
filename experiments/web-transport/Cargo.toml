[package]
name = "tell-tail-web-transport"
version = "0.0.0"
publish = false
edition = "2024"
rust-version = "1.88"

# Deliberately separate from the release package and its lockfile.
[workspace]
members = ["."]

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio", "ws"] }
bytes = "1"
clap = { version = "4.5", features = ["derive"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tell-tail = { path = "../.." }
tokio = { version = "=1.52.3", features = ["macros", "net", "rt", "signal", "sync", "time"] }

[profile.release]
lto = "thin"
codegen-units = 1
