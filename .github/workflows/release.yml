name: Release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'src/**'
      - 'web/**'
      - 'tests/**'
      - 'packaging/tell-tail.rb.in'
      - 'scripts/*release*.py'
      - 'scripts/*formula.py'
      - 'scripts/check_homebrew.py'
      - 'scripts/check_package.py'
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'src/**'
      - 'web/**'
      - 'tests/**'
      - 'packaging/tell-tail.rb.in'
      - 'scripts/*release*.py'
      - 'scripts/*formula.py'
      - 'scripts/check_homebrew.py'
      - 'scripts/check_package.py'
  workflow_dispatch:
    inputs:
      source_commit:
        description: Full candidate SHA (empty uses workflow commit; publishing requires main)
        type: string
        default: ''
      publish:
        description: Publish GitHub Releases, crates.io and Homebrew after validation and approval
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-candidate-${{ github.ref }}-${{ inputs.publish && 'publish' || 'build' }}
  cancel-in-progress: ${{ !inputs.publish }}
jobs:
  candidate:
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.candidate.outputs.commit }}
      version: ${{ steps.candidate.outputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve candidate and fail closed on publication
        id: candidate
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          PUBLISH: ${{ inputs.publish || false }}
        run: |
          if [ "$PUBLISH" = true ]; then test "$GITHUB_REF" = refs/heads/main; fi
          python3 scripts/release_candidate.py \
            --commit "${SOURCE_COMMIT:-$GITHUB_SHA}" --publish "$PUBLISH" --output "$GITHUB_OUTPUT"
  archive:
    needs: candidate
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-14, target: aarch64-apple-darwin}
          - {os: ubuntu-24.04, target: x86_64-unknown-linux-musl}
          - {os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      CARGO_BUILD_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.candidate.outputs.commit }}
          persist-credentials: false
      - run: rustup toolchain install 1.88.0 --profile minimal --target "${{ matrix.target }}"
      - name: Prepare static Linux linking
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y musl-tools
          echo 'CC=musl-gcc' >> "$GITHUB_ENV"
          echo 'RUSTFLAGS=-C linker=musl-gcc -C target-feature=+crt-static' >> "$GITHUB_ENV"
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Build and exercise the native archive
        env:
          TARGET: ${{ matrix.target }}
        run: |
          python3 scripts/package_release.py --target "$TARGET" --binary "target/$TARGET/release/tell-tail"
          python3 scripts/check_release_archive.py dist/*.tar.gz
      - name: Install the candidate through a temporary Homebrew tap
        env:
          TARGET: ${{ matrix.target }}
        run: |
          if [ -x /home/linuxbrew/.linuxbrew/bin/brew ]; then
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          fi
          if ! command -v brew >/dev/null; then
            curl -fsSL https://raw.githubusercontent.com/Homebrew/install/85d1a3fc80d8a63932f632aca8f787de11d14a64/install.sh -o "$RUNNER_TEMP/homebrew-install.sh"
            NONINTERACTIVE=1 bash "$RUNNER_TEMP/homebrew-install.sh"
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          fi
          python3 scripts/check_homebrew.py --target "$TARGET" --assets dist
      - name: Exercise static archives on older glibc and Alpine userspaces
        if: runner.os == 'Linux'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          for image in \
            python:3.11-slim-bullseye@sha256:9e25f400253a5fa3191813d6a67eb801ca1e6f012b3bd2588fa6920b59e3eba6 \
            python:3.11-alpine3.22@sha256:a4fc589b32e824f3f02ed9d7e7be19518aa47e105b80416336af9f202275a489; do
            docker run --rm --network none -v "$PWD/dist:/dist:ro" -v "$PWD/scripts:/checks:ro" \
              "$image" python /checks/check_release_archive.py "/dist/tell-tail-$version-$TARGET.tar.gz"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
  bundle:
    needs: [candidate, archive]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: native-*
          path: dist
          merge-multiple: true
      - run: python3 scripts/release_artifacts.py dist
      - run: python3 scripts/render_formula.py --assets dist --output dist/tell-tail.rb
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-candidate
          path: dist/*
          if-no-files-found: error
          retention-days: 14
  publish:
    if: inputs.publish
    needs: [candidate, bundle]
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 90
    permissions:
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE: ${{ needs.candidate.outputs.commit }}
      VERSION: ${{ needs.candidate.outputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-candidate
          path: dist
      - name: Recheck identity, evidence and archive checksums
        run: |
          python3 scripts/release_gate.py --validation packaging/validation.json --version "$VERSION" --commit "$CANDIDATE"
          python3 scripts/release_artifacts.py dist --verify
          python3 - <<'PY'
          import json, os
          record = json.load(open('dist/release.json'))
          if (record['dirty'] or record['source_commit'] != os.environ['CANDIDATE']
                  or record['version'] != os.environ['VERSION']):
              raise SystemExit('Candidate artifact identity mismatch')
          PY
      - name: Check Homebrew dispatch credentials before publishing any channel
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          test -n "$GH_TOKEN" || { echo 'Configure release environment secret HOMEBREW_TAP_TOKEN'; exit 1; }
          test "$(gh api repos/ding-labs/homebrew-tap/actions/workflows/tell-tail.yml --jq .state)" = active
      - name: Check whether this exact source is already on crates.io
        id: crate
        run: python3 scripts/release_publish.py crate-status --version "$VERSION" --commit "$CANDIDATE"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.candidate.outputs.commit }}
          path: source
          persist-credentials: false
      - run: rustup toolchain install 1.88.0 --profile minimal
      - name: Verify the candidate source package and clean installation
        run: python3 scripts/check_package.py
        working-directory: source
      - name: Authenticate to crates.io with trusted publishing
        if: steps.crate.outputs.exists == 'false'
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish or verify the GitHub release
        id: github
        env:
          # Frozen candidates predating workflow changes need Workflows write for tag creation.
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
        run: python3 scripts/release_publish.py github --version "$VERSION" --commit "$CANDIDATE"
      - name: Publish the candidate to crates.io
        if: steps.crate.outputs.exists == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
        run: cargo publish --locked --registry crates-io
        working-directory: source
      - name: Verify the registry package source and checksum
        id: registry
        run: python3 scripts/release_publish.py verify-crate --version "$VERSION" --commit "$CANDIDATE"
      - name: Install and smoke-test the registry version
        id: registry-install
        run: |
          cargo +1.88.0 install tell-tail --version "$VERSION" --locked --registry crates-io \
            --root "$RUNNER_TEMP/registry-install" --target-dir "$RUNNER_TEMP/registry-build"
          python3 - <<'PYTHON'
          import json, os, pathlib, subprocess, sys
          sys.path.insert(0, 'scripts')
          from check_package import check_web_install
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'registry-install'
          binary = root / 'bin/tell-tail'
          assert subprocess.check_output([str(binary), '--version'], text=True).strip() == 'tell-tail ' + os.environ['VERSION']
          output = subprocess.check_output([str(binary), '--output', 'json'], input=b'INFO first\nWARN second\n')
          assert json.loads(output.splitlines()[-1])['totals']['records'] == 2
          check_web_install(binary, root)
          PYTHON
      - name: Import the stable release into Homebrew and wait for its checks
        id: homebrew
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: python3 scripts/release_publish.py homebrew --version "$VERSION" --commit "$CANDIDATE"
      - name: Summarize channel results
        if: always()
        env:
          GITHUB_RESULT: ${{ steps.github.outcome }}
          CRATES_RESULT: ${{ steps.registry.outcome }}
          INSTALL_RESULT: ${{ steps.registry-install.outcome }}
          HOMEBREW_RESULT: ${{ steps.homebrew.outcome }}
        run: |
          {
            echo "## Tell-Tail $VERSION at $CANDIDATE"
            echo ""
            echo "| Channel | Result |"
            echo "| --- | --- |"
            echo "| [GitHub Releases](https://github.com/$GITHUB_REPOSITORY/releases/tag/v$VERSION) | $GITHUB_RESULT |"
            echo "| [crates.io](https://crates.io/crates/tell-tail/$VERSION) | $CRATES_RESULT (install: $INSTALL_RESULT) |"
            echo "| [Homebrew](https://github.com/ding-labs/homebrew-tap/actions/workflows/tell-tail.yml) | $HOMEBREW_RESULT |"
            echo ""
            echo 'Rerun failed jobs with the same candidate to resume; existing versions and tags are never replaced.'
          } >> "$GITHUB_STEP_SUMMARY"
