name: Extended validation
on:
  schedule:
    - cron: '23 4 * * 0'
  workflow_dispatch:
    inputs:
      maximum_only:
        description: Run only the maximum-configuration memory checks
        type: boolean
        default: false
      source_commit:
        description: Full frozen source SHA (required for maximum_only)
        type: string
        default: ''
      release_soaks:
        description: Run two sequential 24-hour Linux soaks on a dedicated runner
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: extended-validation
  cancel-in-progress: false
jobs:
  fuzz:
    if: ${{ !inputs.maximum_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        target: [framing, classification, timed_engine]
    env:
      ASAN_OPTIONS: quarantine_size_mb=32
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly-2026-10-14 --profile minimal
      - run: cargo +nightly-2026-10-14 install cargo-fuzz --version 0.13.2 --locked
      - run: |
          mkdir -p work
          git rev-parse HEAD > work/commit.txt
          rustc +nightly-2026-10-14 --version > work/toolchain.txt
          cargo +nightly-2026-10-14 metadata --locked --manifest-path fuzz/Cargo.toml --format-version 1 > /dev/null
          cargo +nightly-2026-10-14 test --locked --manifest-path fuzz/Cargo.toml --lib
          cargo +nightly-2026-10-14 fuzz run ${{ matrix.target }} -- -max_total_time=1800 -timeout=5 -rss_limit_mb=512 -max_len=65536 > work/fuzz.log 2>&1
          git diff --exit-code -- Cargo.lock fuzz/Cargo.lock
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: extended-fuzz-${{ matrix.target }}
          path: |
            work/*.txt
            work/*.log
            fuzz/artifacts/
          retention-days: 30
  dashboard:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - name: Require an exact source for resource-only validation
        if: inputs.maximum_only
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: '[[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.maximum_only && inputs.source_commit || github.sha }}
          persist-credentials: false
      - run: rustup toolchain install 1.88.0 --profile minimal
      - run: cargo build --release --locked
      - run: mkdir -p work
      - if: ${{ !inputs.maximum_only }}
        run: python3 scripts/soak.py --seconds 3600 --profile burst --tui --exercise-terminal --report work/dashboard-hour.json 2> work/dashboard-progress.ndjson
      - run: python3 scripts/soak.py --seconds 60 --profile mixed --window 3600 --max-record-bytes 16777216 --rate 100 --rss-limit-mib 128 --report work/maximum.json
      - run: python3 scripts/soak.py --seconds 60 --profile mixed --tui --window 3600 --max-record-bytes 16777216 --rate 100 --rss-limit-mib 128 --report work/maximum-tui.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: extended-dashboard-${{ matrix.os }}
          path: |
            work/*.json
            work/*progress.ndjson
          retention-days: 30
  performance:
    if: ${{ !inputs.maximum_only }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.88.0 --profile minimal
      - run: cargo build --release --locked
      - run: mkdir -p work
      - name: Measure cached rates and five matched mixed-input pairs
        run: python3 scripts/benchmark.py --records 2000000 --repeats 5 --pairs 5 --seconds 60 --profile mixed --report work/performance.json 2> work/performance-progress.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: extended-performance-${{ matrix.os }}
          path: |
            work/performance.json
            work/performance-progress.log
          retention-days: 30
  linux-release-soak:
    if: github.event_name == 'workflow_dispatch' && inputs.release_soaks && !inputs.maximum_only
    # Explicitly provision this runner; hosted jobs cannot supply a 24-hour run.
    runs-on: [self-hosted, linux, tell-tail-validation]
    timeout-minutes: 1500
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        input: [stdin, file]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.88.0 --profile minimal
      - run: cargo build --release --locked
      - run: mkdir -p work
      - if: matrix.input == 'stdin'
        run: python3 scripts/soak.py --seconds 86400 --profile mixed --report work/linux-stdin-day.json 2> work/progress.ndjson
      - if: matrix.input == 'file'
        run: python3 scripts/soak.py --seconds 86400 --input file --profile rotation --output prometheus --report work/linux-file-day.json 2> work/progress.ndjson
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: extended-linux-${{ matrix.input }}
          path: |
            work/linux-*-day.json
            work/progress.ndjson
          retention-days: 30
